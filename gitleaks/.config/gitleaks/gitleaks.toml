# Gitleaks config: default rules + a custom rule flagging public IPv4
# addresses, so real infrastructure values never land in this public repo.
# Private, loopback, link-local, CGNAT and RFC 5737 documentation ranges
# are allowlisted (use 203.0.113.x in examples).

[extend]
useDefault = true

[[rules]]
id = "public-ipv4"
description = "Public IPv4 address (use RFC 5737 documentation ranges in examples)"
regex = '''\b(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\b'''

  [rules.allowlist]
  # Apply the allowlist regexes to the matched IP itself, not the whole line
  regexTarget = "match"
  regexes = [
    '''^0\.''',                                    # "this network"
    '''^10\.''',                                   # RFC 1918
    '''^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.''', # CGNAT 100.64/10
    '''^127\.''',                                  # loopback
    '''^169\.254\.''',                             # link-local
    '''^172\.(1[6-9]|2[0-9]|3[01])\.''',           # RFC 1918
    '''^192\.0\.2\.''',                            # RFC 5737 TEST-NET-1
    '''^192\.168\.''',                             # RFC 1918
    '''^198\.51\.100\.''',                         # RFC 5737 TEST-NET-2
    '''^198\.1[89]\.''',                           # RFC 2544 benchmarking
    '''^203\.0\.113\.''',                          # RFC 5737 TEST-NET-3
    '''^2(2[4-9]|3[0-9]|4[0-9]|5[0-5])\.''',       # multicast + reserved
    '''^255\.255\.255\.255$''',                    # broadcast
  ]
