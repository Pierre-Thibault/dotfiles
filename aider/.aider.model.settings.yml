# Local models via Ollama (ollama_chat/ recommended over ollama/ by aider docs).
# num_ctx matches OLLAMA_CONTEXT_LENGTH set on the server; mistral-small3.2:24b
# has little VRAM headroom left at that context size on a 16GB card, so it may
# spill to CPU (slower) rather than fail outright.
- name: ollama_chat/qwen3:14b
  extra_params:
    api_base: http://ollama.local:11434
    num_ctx: 16384

- name: ollama_chat/mistral-small3.2:24b
  extra_params:
    api_base: http://ollama.local:11434
    num_ctx: 16384
